<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauss-Seidel Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Gauss-Seidel Calculator</h1>
        <p>Solve a 3 × 3 system using the Gauss-Seidel method.</p>

        <h2>Coefficient Matrix</h2>

<div class="matrix">
    <input id="a11" type="number" placeholder="a₁₁">
    <input id="a12" type="number" placeholder="a₁₂">
    <input id="a13" type="number" placeholder="a₁₃">
    <span>=</span>
    <input id="b1" type="number" placeholder="b₁">

    <input id="a21" type="number" placeholder="a₂₁">
    <input id="a22" type="number" placeholder="a₂₂">
    <input id="a23" type="number" placeholder="a₂₃">
    <span>=</span>
    <input id="b2" type="number" placeholder="b₂">

    <input id="a31" type="number" placeholder="a₃₁">
    <input id="a32" type="number" placeholder="a₃₂">
    <input id="a33" type="number" placeholder="a₃₃">
    <span>=</span>
    <input id="b3" type="number" placeholder="b₃">
</div>

        <h2>Initial Values</h2>

        <div class="initial">
            x₁ <input id="x1" type="number" value="0">
            x₂ <input id="x2" type="number" value="0">
            x₃ <input id="x3" type="number" value="0">
        </div>

        <div class="settings">
            <label>
                Tolerance:
                <input id="tolerance" type="number" value="0.0001" step="0.0001">
            </label>

            <label>
                Max Iterations:
                <input id="maxIterations" type="number" value="100">
            </label>
        </div>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
